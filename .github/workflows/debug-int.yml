name: Debug integration failure (temporary)

on:
  push:
    branches: [debug/ci-int-logging]

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          uv venv
          uv pip install -e ".[dev,integration]"
          uv pip list | grep -iE "fastmcp|^mcp|httpx|starlette|uvicorn|pytest-asyncio"

      - name: Isolated failing test with live INFO logs
        if: always()
        run: |
          uv run pytest "tests/integration/test_adapters_integration.py::test_full_mcp_session_round_trip[streamable-http]" \
            -o addopts="" -s --log-cli-level=INFO -p no:cacheprovider 2>&1 | tail -60

      - name: Full dir, exactly as CI (coverage on), 3x
        if: always()
        run: |
          for i in 1 2 3; do
            echo "=== iteration $i"
            uv run pytest tests/integration -q -p no:cacheprovider 2>&1 | tail -3
          done

      - name: Verbatim CI command, 6x
        if: always()
        run: |
          for i in 1 2 3 4 5 6; do
            echo "=== verbatim iteration $i"
            uv run pytest tests/integration -q 2>&1 | tail -2
          done

      - name: Streamable-http alone, 10x
        if: always()
        run: |
          for i in $(seq 1 10); do
            uv run pytest "tests/integration/test_adapters_integration.py::test_full_mcp_session_round_trip[streamable-http]" -o addopts="" -q 2>&1 | tail -1
          done

      - name: Full dir without sse param, 3x
        if: always()
        run: |
          for i in 1 2 3; do
            echo "=== no-sse iteration $i"
            uv run pytest tests/integration -q -k "not sse" 2>&1 | tail -2
          done

      - name: P1 sse+streamable only, NO coverage, 4x
        if: always()
        run: |
          for i in 1 2 3 4; do
            echo "=== P1 iteration $i"
            uv run pytest tests/integration/test_adapters_integration.py -o addopts="" -q -k "sse or streamable" 2>&1 | tail -2
          done

      - name: P2 sse+streamable only, coverage ON, 4x
        if: always()
        run: |
          for i in 1 2 3 4; do
            echo "=== P2 iteration $i"
            uv run pytest tests/integration/test_adapters_integration.py -q -k "sse or streamable" 2>&1 | tail -2
          done

      - name: P4 full dir with DEBUG logs, coverage ON, 1x
        if: always()
        run: |
          uv run pytest tests/integration -q --log-cli-level=DEBUG 2>&1 | tail -250

      - name: Manual curl repro with server debug log
        if: always()
        run: |
          set -x
          FASTMCP_LOG_LEVEL=DEBUG uv run python tests/integration/companion_server.py \
            --transport streamable-http --host 127.0.0.1 --port 8765 > server.log 2>&1 &
          SRV=$!
          sleep 4
          for i in 1 2 3 4 5; do
            echo "=== curl attempt $i"
            curl -sS -i --max-time 20 -X POST http://127.0.0.1:8765/mcp \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json, text/event-stream' \
              -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"mcp-reverse-proxy-integration-tests","version":"0.1.0"}}}' \
              | head -30 || true
          done
          kill $SRV 2>/dev/null || true
          sleep 1
          echo "=== server.log"
          cat server.log
